      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .start-btn:active {

      box-shadow: 0 5px 10px rgba(3,0,5,0.2);
    }

    /* Optional: simulate mobile safe area */
