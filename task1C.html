<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Completed</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: skyblue;
      font-family: Arial, sans-serif;
    }

    .modal {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 45px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
    }

    .check {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 50px;
      font-weight: bold;
    }

    .message {
      font-size: 24px;
      font-weight: 600;
      color: #222;
    }

    @media (max-width: 480px) {
      .modal {
        padding: 35px 20px;
      }

      .check {
        width: 70px;
        height: 70px;
        font-size: 42px;
      }

      .message {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="modal">
    <div class="check">✓</div>
    <div class="message">ಟಾಸ್ಕ್-1 ಮುಕ್ತಾಯವಾಗಿದೆ. Rs: 100/-</div>
  </div>

</body>
</html>
